# The cheap half of CI: everything that needs no Xcode and no Gradle.
#
# This runs on every push and every pull request because it costs about two
# minutes on a free runner. The expensive half — the actual iOS and Android
# compiles — is a separate, manually-triggered workflow (`build.yml`), because a
# native build is twenty minutes of runner time to prove something that a
# developer with the simulators open already knows.
#
# Nothing here needs a secret. The app reads its keys from `EXPO_PUBLIC_*`
# variables at build time, and none of these steps build.
name: checks

on:
  push:
    branches: [main]
    # Minutes are capped, so a commit that cannot change the answer does not
    # spend any. Documentation and the shot list are the common case.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 24, not 22, and it matters: 22 ships npm 10, which resolves the
      # `@typescript-eslint` peer ranges differently from the npm 11 that wrote
      # this lock file and demands a `typescript@5.9.3` that appears nowhere in
      # it. `npm ci` then refuses to install anything at all. Matching the major
      # is cheaper than hand-reconciling a lock two resolvers disagree about.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly the lock file and
      # fails if package.json and the lock have drifted, which is the whole
      # reason to run installs on a machine that is not the author's. It earned
      # that on its first run — an `expo install` had added typescript to
      # package.json without the lock, and every local command kept working.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Lint. `import/first` is off for tests only, because `jest.mock` has to
      # be written before the import it replaces and autofixing would hoist the
      # imports above the mocks and silently un-mock the modules. The reasons
      # for every other exception are in `eslint.config.js`.
      #
      # Errors gate. `set-state-in-effect` from `eslint-plugin-react-hooks` 7 is
      # a deliberate re-sync pattern in an app that does not run the React
      # Compiler, so it is a warning in `eslint.config.js`, with the reason
      # there. Warnings stay visible.
      - name: Lint
        run: npm run lint

      # The `logic` project runs under plain Node against real SQLite and the
      # `ui` project under jest-expo. Neither needs a simulator, which is what
      # makes the whole suite runnable here.
      # Twice, in two zones. The suite passed on the author's machine and failed
      # here on a test whose fixtures were built in Europe/Sofia while the
      # screen rendered in the runner's UTC — "Today 17:30" came out 14:30. A
      # test that passes because of where its author lives is worse than none,
      # and this is an app whose central invariant is that a stored instant
      # never moves. The second run is a zone *behind* UTC, which nothing had
      # ever tried.
      - name: Tests
        run: npm test -- --ci --runInBand
        env:
          TZ: UTC

      - name: Tests (a zone behind UTC)
        run: npm test -- --ci --runInBand
        env:
          TZ: America/Los_Angeles

      # The config plugins rewrite the native projects, and a plugin that throws
      # only surfaces at prebuild — long after the commit that broke it. This
      # generates both native projects and throws them away: it is the cheapest
      # thing that can catch a broken plugin, and it needs no toolchain.
      - name: Prebuild both platforms
        run: npx expo prebuild --no-install --clean

      # Two invariants the repo states in prose and can therefore lose quietly.
      - name: Nothing secret is tracked
        run: |
          set -e
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked. It holds provider keys."
            exit 1
          fi
          if git ls-files | grep -qE '^credentials/'; then
            echo "::error::credentials/ is tracked. The Android upload key cannot be rotated."
            exit 1
          fi
          echo "no secrets tracked"

      # The Android manifest points at backup rules a config plugin generates.
      # If another plugin's resource sweep removed them, the manifest would keep
      # naming them and Android would silently back up nothing. Nothing else
      # fails when this breaks, so it is checked here.
      - name: The database is in the Android backup set
        run: |
          set -e
          rules=android/app/src/main/res/xml/ridik_backup_rules.xml
          test -f "$rules" || { echo "::error::$rules was not generated"; exit 1; }
          grep -q 'domain="file" path="SQLite"' "$rules" \
            || { echo "::error::the database is not in the backup rules"; exit 1; }
          grep -q 'ridik_backup_rules' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::the manifest does not point at the generated rules"; exit 1; }
          echo "database is backed up"
