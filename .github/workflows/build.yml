# The expensive half: actual compiled apps, on demand.
#
# Deliberately NOT on every push. A native build is ~20 minutes of macOS runner
# time per platform to prove something the author already knows from the
# simulators sitting open on their desk — and macOS minutes bill at ten times
# the Linux rate. The cheap checks live in `checks.yml` and run on every push;
# this runs when somebody actually wants an artefact:
#
#   * manually, from the Actions tab (choose one platform or both), or
#   * automatically on a `v*` tag, which is the moment a build stops being a
#     curiosity and becomes a candidate for a store.
#
# What comes out are **debug** builds, and it is worth being exact about what
# that does and does not get you, because the obvious reading is wrong.
#
# A debug APK carries no JavaScript. `assembleDebug` skips the bundling phase, so
# the app fetches its bundle from a Metro dev server at run time — meaning it
# installs anywhere and *runs* only where it can reach your machine
# (`adb reverse tcp:8081 tcp:8081` over USB, or the same wifi). Handed to
# somebody else it opens on a red "unable to load script" screen. Forcing a
# bundle into it is not the fix either: the RN gradle plugin decides that by
# variant, so making debug self-contained takes Fast Refresh away from the local
# loop, which is the one thing debug is for.
#
# What you actually want for "send it to a tester" is `npm run release
# android:apk` — a release build, self-contained, signed with the upload key in
# `credentials/` and installable by anyone. That key is gitignored and is the one
# credential that cannot ever be rotated, so it is deliberately not available
# here; these artefacts are for proving the build compiles, not for handing out.
# `npm run release android:aab` is the only thing Play accepts.
#
# The iOS artefact is a *simulator* app, for the same reason: a device build
# needs the Apple developer account and its certificates.
name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform to build
        type: choice
        options: [both, android, ios]
        default: both
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    # A tag builds everything; a manual run builds what was asked for.
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'both' ||
      inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 24, not 22, and it matters: 22 ships npm 10, which resolves the
      # `@typescript-eslint` peer ranges differently from the npm 11 that wrote
      # this lock file and demands a `typescript@5.9.3` that appears nowhere in
      # it. `npm ci` then refuses to install anything at all. Matching the major
      # is cheaper than hand-reconciling a lock two resolvers disagree about.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # JDK 21, not the runner's default. 25 fails `configureCMakeDebug` with
      # "A restricted method in java.lang.System has been called" — the same
      # trap AGENTS.md records for local builds, and it costs a full build to
      # rediscover.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Prebuild
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ENTITLEMENT }}
          EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ridik-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator app
    if: >-
      github.event_name == 'push' ||
      inputs.platform == 'both' ||
      inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 24, not 22, and it matters: 22 ships npm 10, which resolves the
      # `@typescript-eslint` peer ranges differently from the npm 11 that wrote
      # this lock file and demands a `typescript@5.9.3` that appears nowhere in
      # it. `npm ci` then refuses to install anything at all. Matching the major
      # is cheaper than hand-reconciling a lock two resolvers disagree about.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # `--no-install` skips CocoaPods, which deletes `ios/Ridik.xcworkspace`
      # and leaves xcodebuild reporting only that the workspace "does not
      # exist". `pod install` has to follow every iOS prebuild.
      - name: Prebuild
        run: npx expo prebuild --platform ios --no-install --clean
        env:
          EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
          EXPO_PUBLIC_REVENUECAT_ENTITLEMENT: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ENTITLEMENT }}
          EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}

      - name: Pods
        run: pod install --project-directory=ios

      # A simulator build, so no signing identity is needed. A device build
      # would need the Apple developer account and its certificates, which is
      # the point at which this stops being free.
      - name: Build
        run: |
          xcodebuild \
            -workspace ios/Ridik.xcworkspace \
            -scheme Ridik \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package
        run: |
          cd ios/build/Build/Products/Debug-iphonesimulator
          zip -ryq Ridik-simulator.zip Ridik.app

      - uses: actions/upload-artifact@v4
        with:
          name: ridik-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/Ridik-simulator.zip
          if-no-files-found: error
          retention-days: 14
